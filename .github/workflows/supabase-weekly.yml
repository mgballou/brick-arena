name: Supabase weekly

# Keeps the Free Supabase project from pausing, tells Matthew when it has, and
# deletes the full rows of matches older than 90 days (packages/cli/src/upkeep.ts,
# docs/deploy.md). With the secrets unset each step says so and passes. It has
# no pull_request trigger: a PR blanks the secrets, so every step passed and
# gated nothing. `pnpm test` covers upkeep.ts.

on:
  schedule:
    # Mondays at 14:17 UTC, off the hour when GitHub's cron runs late.
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A prune or insert already running is never cancelled; the next run waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  weekly:
    name: pause check, keep-awake insert, 90-day prune
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Fails when the project doesn't answer, which skips the other two.
      - name: pause check
        run: pnpm weekly check

      - name: keep-awake insert
        run: pnpm weekly awake

      - name: 90-day prune
        run: pnpm weekly prune
