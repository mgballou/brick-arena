name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fails, rather than skips, a PR behind its base: a run whose jobs were all
  # skipped concludes success, which reads as a pass.
  gate:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, laila-mac]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Require the branch to be current with its base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" != "0" ]; then
            echo "::error::This branch is $behind commits behind $BASE. Update it to run CI."
            exit 1
          fi
  check:
    needs: gate
    name: install, test, typecheck
    runs-on: [self-hosted, laila-mac]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The pnpm of packageManager in package.json, which wrote the lockfile
      # and reads `allowBuilds` in pnpm-workspace.yaml.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm test

      - name: typecheck
        run: pnpm exec tsc -b

  browser:
    needs: gate
    name: browser specs in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # The Chromium that the pinned @playwright/test drives, and the system
      # libraries it needs.
      - name: install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts the dev server against the stand-in, the
      # built page on the hosted app with no key, and Render's build on
      # serve.ts's own options with a fake TypeSafe (e2e/deployed.e2e.ts). None
      # can reach Jev.
      - name: e2e
        run: pnpm e2e

      # Each failed spec's trace, and every spec's screenshot.
      - name: upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results
          path: test-results/
          retention-days: 14

  db:
    needs: gate
    name: Supabase path on Postgres and PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # The stack of supabase/local/compose.yml, not job service containers:
      # those start before the checkout, so they can't mount its roles and its
      # gateway, and the proof would run on a stack no one runs locally.
      - name: start Postgres and PostgREST
        run: pnpm db:up

      - name: test:db
        run: pnpm test:db

      - name: stack logs
        if: failure()
        run: docker compose -f supabase/local/compose.yml logs
