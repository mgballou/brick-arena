name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A branch behind its base is not a failure: the gate says so in a notice and
  # skips the jobs below, so a merge to main never turns the open PRs red.
  gate:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, laila-mac]
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::This branch is $behind commits behind $BASE. Update it to run CI."; echo "run=false" >> "$GITHUB_OUTPUT"; fi
  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: install, test, typecheck
    runs-on: [self-hosted, laila-mac]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The pnpm of packageManager in package.json, which wrote the lockfile
      # and reads `allowBuilds` in pnpm-workspace.yaml.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm test

      - name: typecheck
        run: pnpm exec tsc -b

  browser:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: browser specs in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # The Chromium that the pinned @playwright/test drives, and the system
      # libraries it needs.
      - name: install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts the dev server against the stand-in, the
      # built page on the hosted app with no key, and Render's build on
      # serve.ts's own options with a fake TypeSafe (e2e/deployed.e2e.ts). None
      # can reach Jev.
      - name: e2e
        run: pnpm e2e

      # Each failed spec's trace, and every spec's screenshot.
      - name: upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results
          path: test-results/
          retention-days: 14

  db:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Supabase path on Postgres and PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # The stack of supabase/local/compose.yml, not job service containers:
      # those start before the checkout, so they can't mount its roles and its
      # gateway, and the proof would run on a stack no one runs locally.
      - name: start Postgres and PostgREST
        run: pnpm db:up

      - name: test:db
        run: pnpm test:db

      - name: stack logs
        if: failure()
        run: docker compose -f supabase/local/compose.yml logs
