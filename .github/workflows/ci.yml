name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: install, test, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo pins no packageManager; this matches the pnpm that wrote the
      # lockfile and reads `allowBuilds` in pnpm-workspace.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm test

      - name: typecheck
        run: pnpm exec tsc -b
