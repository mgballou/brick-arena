name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          behind=$(gh api "repos/${{ github.repository }}/compare/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" --jq .behind_by)
          if [ "$behind" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::This branch is $behind commits behind ${{ github.base_ref }}. Update it to run CI."; echo "run=false" >> "$GITHUB_OUTPUT"; fi
  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: install, test, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo pins no packageManager; this matches the pnpm that wrote the
      # lockfile and reads `allowBuilds` in pnpm-workspace.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm test

      - name: typecheck
        run: pnpm exec tsc -b
