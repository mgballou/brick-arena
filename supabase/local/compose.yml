# Postgres and PostgREST on this machine, set up the way a Supabase project
# serves them, so `pnpm test:db` can drive the real client against the real
# Data API (docs/deploy.md, "Proving the Supabase path"). Everything here is
# local: the keys and the JWT secret are fixed, public and good for nothing
# else.
#
#   pnpm db:up      start it, and wait until both answer
#   pnpm db:down    stop it and drop the data
#
# The versions are Supabase's: Postgres 17 and the PostgREST that
# github.com/supabase/postgres pins (ansible/vars.yml, postgrest_release).
name: brick-arena-db

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 127.0.0.1:54322:5432
    volumes:
      # The roles exist before PostgREST first logs in; `pnpm test:db` runs
      # this again after it resets the schema.
      - ./roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: pg_isready -U postgres -h 127.0.0.1
      interval: 1s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:local-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: brick-arena-local-proof-only-not-a-real-secret
      # Supabase's default cap on the rows one read returns.
      PGRST_DB_MAX_ROWS: 1000
      PGRST_ADMIN_SERVER_PORT: 3001

  # Supabase's gateway in small: a secret key on `apikey` becomes the
  # service_role JWT, the publishable key becomes anon's, anything else is 401.
  api:
    image: nginx:1.29-alpine
    depends_on:
      rest:
        condition: service_started
    ports:
      - 127.0.0.1:54321:8000
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:8000/ready
      interval: 1s
      timeout: 3s
      retries: 30
