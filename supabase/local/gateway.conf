# The part of Supabase's API gateway the Data API sees (compose.yml). The keys
# are local and public; the JWTs are signed with compose.yml's PGRST_JWT_SECRET.

map $http_apikey $role_jwt {
  default "";
  # SUPABASE_SECRET_KEY for `pnpm test:db`: service_role, which bypasses
  # row-level security.
  sb_secret_brick_arena_local "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoiYnJpY2stYXJlbmEtbG9jYWwifQ.PLS6F1FyxneRLAWi-gclt35jeFDT30ouV5JI5iXEW0I";
  # The publishable key: anon, which row-level security shuts out.
  sb_publishable_brick_arena_local "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImJyaWNrLWFyZW5hLWxvY2FsIn0.ANBIdQDw51pSNLNlF3aSMYkUuoa_QO0s_aNuUSOGciQ";
}

server {
  listen 8000;

  # PostgREST's admin port: 200 once it has loaded the schema.
  location = /ready {
    proxy_pass http://rest:3001/ready;
  }

  location /rest/v1/ {
    # For the 401 below; a proxied answer keeps its own type.
    default_type application/json;
    if ($role_jwt = "") {
      return 401 '{"message":"Invalid API key"}';
    }
    proxy_set_header Authorization $role_jwt;
    proxy_pass http://rest:3000/;
  }
}
